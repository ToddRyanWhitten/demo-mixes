name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - name: Check out site and Git LFS audio
        uses: actions/checkout@v7
        with:
          lfs: true

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Assemble static site
        run: |
          mkdir -p _site/archive
          cp index.html styles.css ./*.mp3 _site/
          cp archive/index.html archive/*.mp3 _site/archive/

      - name: Upload site
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
